<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Researched.ai - Tool Workspace</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 min-h-screen flex flex-col antialiased">

    <!-- Top Navigation Header -->
    <div class="sticky top-4 z-50 max-w-6xl mx-auto px-4 w-full">
        <header class="bg-white/95 backdrop-blur-md border border-slate-200 shadow-lg shadow-slate-200/50 rounded-full px-6 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2.5">
                <div class="bg-[#0b132b] text-white w-9 h-9 rounded-full flex items-center justify-center font-bold shadow-md">
                    <i class="fa-solid fa-atom text-base"></i>
                </div>
                <span class="text-xl font-extrabold tracking-tight text-[#0b132b]">Researched<span class="text-blue-600">.ai</span></span>
            </a>
            <nav class="hidden md:flex items-center gap-7 text-sm font-semibold text-slate-700">
                <a href="index.html" class="hover:text-blue-600 transition">Home</a>
                <a href="index.html#workflows" class="hover:text-blue-600 transition">Workflows</a>
                <a href="index.html#pricing" class="hover:text-blue-600 transition">Pricing</a>
            </nav>
            <div>
                <a href="index.html" class="bg-[#0b132b] hover:bg-slate-800 text-white px-5 py-2 rounded-full text-xs font-bold tracking-wide transition shadow-md">
                    &larr; Back to Home
                </a>
            </div>
        </header>
    </div>

    <!-- Dynamic Tool Workspace Area -->
    <main class="max-w-5xl mx-auto px-4 py-12 w-full flex-grow">
        <div class="bg-[#0b132b] text-white border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center font-bold text-xl">
                        <i id="tool-icon" class="fa-solid fa-laptop-code"></i>
                    </div>
                    <div>
                        <span id="tool-category" class="text-[10px] font-bold uppercase tracking-wider text-blue-400">Active Module</span>
                        <h1 id="tool-title" class="text-2xl font-black text-white">Loading Workspace...</h1>
                    </div>
                </div>
                <a href="index.html" class="text-xs text-slate-300 hover:text-white bg-slate-800 px-4 py-2 rounded-xl border border-slate-700 transition">Exit Tool</a>
            </div>

            <div id="tool-body" class="space-y-4 text-sm text-slate-300 min-h-[250px]">
                <p>Initializing secure API connectors and multiagent pipelines...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t border-slate-200 bg-white py-8 text-center text-xs text-slate-500">
        <p>&copy; 2026 Researched.ai. Multi-Source Grounded Academic Engine.</p>
    </footer>

    <!-- Script to Handle Dynamic Tool Loading -->
    <script>
        const params = new URLSearchParams(window.location.search);
        const tool = params.get('tool') || 'general';
        const type = params.get('type') || 'app';

        const titleElem = document.getElementById('tool-title');
        const bodyElem = document.getElementById('tool-body');
        const iconElem = document.getElementById('tool-icon');
        const categoryElem = document.getElementById('tool-category');

        const formattedName = tool.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

        if (type === 'info') {
            categoryElem.innerText = "Documentation & Overview";
            titleElem.innerText = formattedName + " Overview";
            iconElem.className = "fa-solid fa-circle-info";
            bodyElem.innerHTML = `
                <div class="space-y-4 bg-slate-900/90 p-6 rounded-2xl border border-slate-800">
                    <h2 class="text-lg font-bold text-blue-400">About ${formattedName}</h2>
                    <p class="text-xs text-slate-300 leading-relaxed">This module is part of Researched.ai's academic suite, built to integrate with Semantic Scholar, PubMed, and Crossref API pipelines for automated literature extraction and verification.</p>
                    <div class="pt-4">
                        <a href="tool.html?tool=${tool}&type=app" class="inline-block bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-6 py-3 rounded-xl transition shadow-md">Launch Active Tool &rarr;</a>
                    </div>
                </div>`;
        } else {
            categoryElem.innerText = "Active Workspace";
            titleElem.innerText = formattedName + " Workspace";
            
            if (tool === 'ai-editor') {
                iconElem.className = "fa-solid fa-pen-nib";
                bodyElem.innerHTML = `
                    <div class="space-y-3 bg-slate-900/90 p-6 rounded-2xl border border-slate-800">
                        <label class="text-xs font-bold text-blue-400">Paste your manuscript text for scholarly tone refinement:</label>
                        <textarea id="editor-text" rows="6" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-xs text-slate-200 focus:outline-none focus:border-blue-500">The results demonstrates significant improvements in cross-platform latency when deploying multi-agent retrieval frameworks.</textarea>
                        <button onclick="alert('Manuscript successfully polished and aligned with target journal standards!')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition">Polish Academic Tone</button>
                    </div>`;
            } else if (tool === 'pdf-chat') {
                iconElem.className = "fa-solid fa-file-pdf";
                bodyElem.innerHTML = `
                    <div class="space-y-3 bg-slate-900/90 p-6 rounded-2xl border border-slate-800 text-center">
                        <div class="border-2 border-dashed border-slate-700 rounded-2xl p-8 space-y-3">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-blue-400"></i>
                            <p class="text-xs font-bold text-slate-200">Upload your research PDF papers for automated evidence extraction</p>
                            <input type="file" id="pdf-in" class="hidden" onchange="alert('PDF successfully indexed! 4 tables and 18 equations loaded for querying.')">
                            <button onclick="document.getElementById('pdf-in').click()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition">Browse PDF Files</button>
                        </div>
                    </div>`;
            } else {
                iconElem.className = "fa-solid fa-laptop-code";
                bodyElem.innerHTML = `
                    <div class="space-y-4 bg-slate-900/90 p-6 rounded-2xl border border-slate-800">
                        <p class="text-xs text-slate-300">Active tool environment initialized for <strong>${formattedName}</strong>. All API connectors, citation managers, and multiagent nodes are fully online.</p>
                        <button onclick="alert('${formattedName} task executed successfully!')" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition">Execute Tool Action</button>
                    </div>`;
            }
        }
    </script>
</body>
</html>
