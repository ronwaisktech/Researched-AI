<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Researched.ai - Commercial Academic Research Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold">
                    <i class="fa-solid fa-atom text-xl"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-white">Researched<span class="text-blue-500">.ai</span></span>
            </div>
            
            <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-300">
                <a href="#search" class="hover:text-white transition">Search Engine</a>
                <a href="#studio" class="hover:text-white transition">Studio Workspace</a>
                <a href="#sources" class="hover:text-white transition">Integrated Sources</a>
            </nav>

            <div class="flex items-center space-x-4">
                <button class="text-slate-400 hover:text-white text-sm font-medium transition">Sign In</button>
                <button class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition shadow-lg shadow-blue-600/30">
                    Pro Access
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-10">

        <!-- Hero Title Section -->
        <section class="text-center space-y-4 max-w-3xl mx-auto">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">
                Grounded Academic Research, <span class="gradient-text">Unified</span>.
            </h1>
            <p class="text-slate-400 text-base md:text-lg">
                Perform multi-source Boolean discovery across Crossref, Semantic Scholar, OpenAlex, and PubMed with structured citation synthesis.
            </p>
        </section>

        <!-- Search & Source Configuration Module -->
        <section id="search" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i class="fa-solid fa-magnifying-glass text-blue-500"></i> Multi-Source Search Builder
                </h2>
                <!-- Source Selection Toggles -->
                <div id="sources" class="flex flex-wrap items-center gap-2 text-xs">
                    <label class="flex items-center gap-1.5 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full cursor-pointer hover:border-blue-500 transition">
                        <input type="checkbox" id="src-semanticscholar" checked class="rounded border-slate-700 text-blue-600 focus:ring-0">
                        <span>Semantic Scholar</span>
                    </label>
                    <label class="flex items-center gap-1.5 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full cursor-pointer hover:border-blue-500 transition">
                        <input type="checkbox" id="src-crossref" checked class="rounded border-slate-700 text-blue-600 focus:ring-0">
                        <span>Crossref</span>
                    </label>
                    <label class="flex items-center gap-1.5 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full cursor-pointer hover:border-blue-500 transition">
                        <input type="checkbox" id="src-openalex" checked class="rounded border-slate-700 text-blue-600 focus:ring-0">
                        <span>OpenAlex</span>
                    </label>
                    <label class="flex items-center gap-1.5 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-full cursor-pointer hover:border-blue-500 transition">
                        <input type="checkbox" id="src-pubmed" checked class="rounded border-slate-700 text-blue-600 focus:ring-0">
                        <span>PubMed</span>
                    </label>
                </div>
            </div>

            <!-- Search Inputs -->
            <div class="space-y-4">
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <input type="text" id="query-input" placeholder="Enter keywords, DOIs, or topic (e.g., 'machine learning healthcare')..." 
                            class="w-full bg-slate-950 border border-slate-700 text-slate-100 placeholder-slate-500 rounded-xl px-4 py-3.5 pl-11 text-sm focus:outline-none focus:border-blue-500 transition">
                        <i class="fa-solid fa-search absolute left-4 top-4 text-slate-500"></i>
                    </div>
                    <button onclick="executeSearch()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3.5 rounded-xl font-medium text-sm transition flex items-center gap-2">
                        <span>Execute Search</span>
                    </button>
                </div>

                <!-- Boolean Query Builder Helpers -->
                <div class="flex items-center gap-2 text-xs text-slate-400">
                    <span class="font-medium text-slate-500">Quick Operators:</span>
                    <button onclick="appendOperator('AND')" class="bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded border border-slate-700">AND</button>
                    <button onclick="appendOperator('OR')" class="bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded border border-slate-700">OR</button>
                    <button onclick="appendOperator('NOT')" class="bg-slate-800 hover:bg-slate-700 px-2.5 py
